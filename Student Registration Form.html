<h2>Student Registration Form</h2>
<title>Student Registration</title>
<label for="name"> Full Name:</label>
  <input type="text" 
         id="name" 
         name="fullname" r
         placeholder="Enter your full name"
         minlength="3"
         maxlength="50"
         required>
         <br><br>
<label for="number">Student Code:</label>
  <input type="text"
         id="number" 
         name="studentCode" 
         placeholder="Enter your student code"
         required>
         <br><br>
<label for="email">Email:</label>
  <input type="email" 
         id="email" 
         name="email" 
         placeholder="Enter your email"
         required>
         <br><br>
<label for="phone">Phone Number:</label>
  <input type="text" 
         id="phone" 
         name="phone" 
         placeholder="Enter your phone number"
         pattern="[0-9]{10}"
         required>
         <br><br>
<label for="date">Date of Birth:</label>
  <input type="date" 
         id="date" 
         name="dob" 
         required>
         <br><br>
<label for="number">Age:</label>
  <input type="number" 
         id="age" 
         name="age" 
         min="18" 
         max="30"
         required>
         <br><br>
<label for="radio">Gender:</label>
  <input type="radio" 
         id="radio" 
         name="gender" 
         value="male" 
         required>
  <label for="radio">Male</label>
  <input type="radio" 
         id="radio2" 
         name="gender" 
         value="female" 
         required>
  <label for="radio2">Female</label>
  <br><br>
<label for="major">Major:</label>
    <select id="major"
            name="major" 
            required>
        <option value="">Select your major</option>
        <option value="it">it</option>
        <option value="informationTechnology">Information Technology</option>
        <option value="framer">framer</option>
        <option value="ai">AI</option>
    </select>
    <select id="year" name="year" required>
        <option value="">Select your year</option>
        <option value="first">1</option>
        <option value="second">2</option>
        <option value="third">3</option>
        <option value="fourth">4</option>
    </select>
    <br><br>
<label for="hobbies">Hobbies:</label>
    <input type="checkbox" 
           id="hobbies" 
           name="hobbies" 
           value="reading">
    <label for="hobbies">Reading</label>
    <input type="checkbox" 
           id="hobbies2" 
           name="hobbies" 
           value="traveling">
    <label for="hobbies2">Traveling</label>
    <input type="checkbox" 
           id="hobbies3" 
           name="hobbies" 
           value="sports">
    <label for="hobbies3">Sports</label>
    <br><br>
<label for="Programming Languages">Programming Languages:</label>
    <input type="checkbox" 
           id="languages" 
           name="languages" 
           value="C">
    <label for="languages">C</label>
    <input type="checkbox" 
           id="languages2" 
           name="languages" 
           value="python">
    <label for="languages2">Python</label>
    <input type="checkbox" 
           id="languages3" 
           name="languages" 
           value="c++">
    <label for="languages3">C++</label>
    <br><br>
<label for="picture">Upload Picture:</label>
  <input type="file" 
         id="picture" 
         name="picture" 
         accept="image/*"
         required>
         <br>
         <br>
<label for="student id"> Student ID:</label>
    <input type="text"
           id="student id"
           name="student id"
           placeholder="Enter your student ID"
           required>
        <br><br>
<label for="country">Country:</label>
    <input type="text"
           id="country"
           name="country"
           placeholder="VIETNAM"
           value="VIETNAM"
           readonly>
        <br><br>
<label for="address">Address:</label>
    <textarea id="address"
              name="address"
              placeholder="Enter your address"
              required></textarea>
        <br><br>
<label for="introduction">Introduction:</label>
    <textarea id="introduction"
              name="introduction"
              placeholder="Tell us about yourself"
              maxlength="200"
              required></textarea>
        <br><br>
<label for="password">Password:</label>
  <input type="password" 
         id="password" 
         name="password" 
         placeholder="Enter your password"
         minlength="6"
         required>
         <br><br>
<label for="submit"></label>
  <input type="submit" 
         id="submit" 
         name="submit" 
         value="Submit">
    <input type="reset" 
         id="reset" 
         name="reset" 
         value="Reset">
